# Sloth Daemon Configuration
dry_run = true

[sampling]
interval_secs = 2
cpu_threshold_pct = 90.0
sustained_secs = 30

[throttle]
quota_pct = 20
max_concurrent = 5
ttl_secs = 600
cool_down_samples = 5

[ai]
provider = "rules"
fallback_to_rules = false
ollama_url = "http://localhost:11434"
model = "qwen2.5:0.5b"
timeout_secs = 60
min_confidence = 0.8
never_throttle = []
throttle_candidates = []

[protected]
extra_names = []
