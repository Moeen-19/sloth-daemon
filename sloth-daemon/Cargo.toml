[package]
name = "sloth-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
aya = "0.14.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "signal", "time"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
# HTTP client for Ollama (local only, no proxy, hard timeout)
reqwest = { version = "0.12", features = ["json"], default-features = false, optional = false }
# URL parsing for loopback validation (already a transitive dep via reqwest)
url = "2.5"

[dev-dependencies]
# Lightweight HTTP stub server for AI classifier unit tests (no real model needed)
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "signal", "time", "net"] }
